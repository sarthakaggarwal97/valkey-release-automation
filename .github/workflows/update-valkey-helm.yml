name: Update Valkey Helm

on:
  workflow_call:
    inputs:
      version:
        description: Valkey GA version to record as the chart appVersion.
        required: true
        type: string
      release_owner:
        description: GitHub login that approved the production release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  open-chart-pr:
    name: Open chart bump PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate GA version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Helm updates require a three-part GA version" >&2
            exit 1
          }

      - name: Create Helm update token
        id: token
        if: github.repository_owner == 'valkey-io'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.VALKEYRIE_BOT_APP_ID }}
          private-key: ${{ secrets.VALKEYRIE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkey-helm
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Checkout release automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: automation
          persist-credentials: false

      - name: Checkout Helm chart
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/valkey-helm
          path: helm
          token: ${{ github.repository_owner == 'valkey-io' && steps.token.outputs.token || secrets.AUTOMATION_PAT }}

      - name: Update chart metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python automation/scripts/update_helm_chart.py \
            --chart helm/valkey/Chart.yaml \
            --readme helm/valkey/README.md \
            --app-version "$VERSION"

      # This PR is deliberately a draft. The Valkey container PR and Docker
      # Library publication are asynchronous; a maintainer makes the chart PR
      # ready only after docker.io/valkey/valkey:<version> is public.
      - name: Open or update chart PR
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.repository_owner == 'valkey-io' && steps.token.outputs.token || secrets.AUTOMATION_PAT }}
          path: helm
          branch: update-valkey-${{ inputs.version }}
          delete-branch: true
          signoff: true
          commit-message: "Update valkey chart for ${{ inputs.version }}"
          title: "Update valkey chart to appVersion ${{ inputs.version }}"
          draft: true
          body: |
            Automated chart bump for Valkey `${{ inputs.version }}`.

            This starts as a draft because the chart's default image must be
            public at `docker.io/valkey/valkey:${{ inputs.version }}` before merge.

      - name: Notify release owner
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.repository_owner == 'valkey-io' && steps.token.outputs.token || secrets.AUTOMATION_PAT }}
          TARGET_REPO: ${{ github.repository_owner }}/valkey-helm
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          RELEASE_OWNER: ${{ inputs.release_owner }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_OWNER" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$ ]] || {
            echo "Invalid release owner login: $RELEASE_OWNER" >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid PR number: $PR_NUMBER" >&2; exit 1; }
          marker='<!-- valkey-release-owner-review -->'
          comments=$(gh api --paginate "repos/${TARGET_REPO}/issues/${PR_NUMBER}/comments" --jq '.[].body')
          if grep -Fq "$marker" <<< "$comments"; then
            echo "Release owner was already notified on PR #$PR_NUMBER."
            exit 0
          fi
          body=$(printf '@%s, please review this automated release PR.\n\n%s' "$RELEASE_OWNER" "$marker")
          gh api --method POST "repos/${TARGET_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
