name: Build Linux ARM binary packages into S3 bucket

on:
  workflow_call:
    inputs:
      version:
        description: The version of Valkey to create.
        type: string
        required: true
      build_matrix:
        description: The build targets to produce as a JSON matrix.
        type: string
        required: true
      region:
        description: The AWS region to push packages into.
        type: string
        required: true
      source_sha:
        description: Exact valkey commit to build from (qualification); empty builds inputs.version.
        type: string
        required: false
        default: ''
      publish:
        description: Upload the tarballs to S3 (false = qualification, artifacts only).
        type: boolean
        required: false
        default: true
    secrets:
      bucket_name:
        description: The S3 bucket to push packages into.
        required: false
      role_to_assume:
        description: The role to assume for the S3 bucket.
        required: false

# No workflow-level permissions: a called workflow may not exceed its
# caller's grant, so permissions flow from the caller. build-release.yml
# grants id-token:write (OIDC for S3) for production builds; the
# qualification caller grants contents:read only, so a qualification
# build of unreleased code can never mint an OIDC token.

jobs:
  build-valkey:
    # Capture source tarball and generate checksum for it
    name: Build package ${{ matrix.distro.target }} ${{ matrix.distro.arch }}
    runs-on: ${{ matrix.distro.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.build_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ github.repository_owner }}/valkey
          ref: ${{ inputs.source_sha != '' && inputs.source_sha || inputs.version }}

      - name: Verify checkout matches the requested commit
        if: inputs.source_sha != ''
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          if [[ "$HEAD_SHA" != "${{ inputs.source_sha }}" ]]; then
            echo "Checkout is at $HEAD_SHA, not the requested ${{ inputs.source_sha }}"
            exit 1
          fi

      - name: Configure AWS credentials
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ inputs.region }}
          role-to-assume: ${{ secrets.role_to_assume }}
      
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev libsystemd-dev

      - name: Make Valkey
        run: |
          set -euo pipefail
          
          VERSION="${{ inputs.version }}"
          echo "Building for version: $VERSION"

          if [[ "$VERSION" != "unstable" ]]; then
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
            if [[ $(echo "$MAJOR_MINOR < 8.1" | bc -l) -eq 1 ]]; then
              echo "Version $MAJOR_MINOR is less than 8.1 — no USE_FAST_FLOAT"
              make -C src all BUILD_TLS=yes USE_SYSTEMD=yes
            else
              echo "Version $MAJOR_MINOR is 8.1 or higher — enabling USE_FAST_FLOAT"
              make -C src all BUILD_TLS=yes USE_SYSTEMD=yes USE_FAST_FLOAT=yes
            fi
          else
            echo "Unstable version detected — enabling USE_FAST_FLOAT"
            make -C src all BUILD_TLS=yes USE_SYSTEMD=yes USE_FAST_FLOAT=yes
          fi

      - name: Create Tarball and SHA256sums
        run: |
          TAR_FILE_NAME=valkey-${{inputs.version}}-${{matrix.distro.platform}}-${{ matrix.distro.arch}}
          mkdir -p "$TAR_FILE_NAME/bin" "$TAR_FILE_NAME/share"
          rsync -av --exclude='*.c' --exclude='*.d' --exclude='*.o' src/valkey-* "$TAR_FILE_NAME/bin/"
          cp -v COPYING "$TAR_FILE_NAME/share/LICENSE"
          tar -czvf $TAR_FILE_NAME.tar.gz $TAR_FILE_NAME
          sha256sum $TAR_FILE_NAME.tar.gz > $TAR_FILE_NAME.tar.gz.sha256
          mkdir -p packages-files
          cp -rfv $TAR_FILE_NAME.tar* packages-files/
          
      - name: Sync to S3
        if: inputs.publish
        run: aws s3 sync packages-files s3://${{ secrets.bucket_name }}/releases/

      - name: Upload qualification artifacts
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualify-${{ inputs.version }}-${{ matrix.distro.platform }}-${{ matrix.distro.arch }}
          path: packages-files/
          retention-days: 30