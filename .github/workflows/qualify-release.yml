# Qualify a release candidate: build everything, publish nothing.
#
# Runs the archive builds and (for non-rc) the RPM/DEB package matrix against
# an EXACT valkey commit, before any GitHub Release, tag, S3 upload, or
# downstream update exists. This is the pre-publication gate that catches a
# 7.2.14-style failure (a package matrix that cannot build) while the release
# is still nothing but a merged notes PR.
#
# No-publish is structural, not conditional: this workflow passes NO secrets
# to the called workflows, so qualification cannot obtain AWS credentials at
# all; the called workflows' publish steps are additionally gated off by
# publish: false. Outputs are workflow artifacts only.
#
# The run-name embeds both the version and the exact source SHA: dispatches
# return no run id and run metadata does not carry inputs, so the release
# controller correlates qualification evidence by matching the SHA in the
# run-name. Do not change its format without updating the controller.
name: Qualify Release

run-name: "Qualify ${{ inputs.version }} @ ${{ inputs.source_sha }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version under qualification (e.g. 9.1.2 or 9.2.0-rc1).
        required: true
        type: string
      source_sha:
        description: The exact valkey commit (full 40-character SHA) to qualify.
        required: true
        type: string

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate version and SHA shapes
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase 40-character SHA: $SOURCE_SHA"
            exit 1
          fi

  generate-build-matrix:
    name: Generate build matrix
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      x86-matrix: ${{ steps.matrix.outputs.x86_64-build-matrix }}
      arm-matrix: ${{ steps.matrix.outputs.arm64-build-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate matrix
        id: matrix
        uses: ./.github/actions/generate-package-build-matrix
        with:
          ref: ${{ inputs.source_sha }}

  # NOTE: no `secrets:` on any of these calls — qualification runs with zero
  # AWS credentials in scope, in addition to publish: false.
  qualify-linux-x86-archives:
    name: Qualify x86 archives
    needs: generate-build-matrix
    # contents:read only - and critically NOT id-token:write: the archive
    # jobs execute make from the unreleased candidate commit, and any
    # id-token grant would let that build code mint an OIDC token.
    permissions:
      contents: read
    uses: ./.github/workflows/call-build-linux-x86-packages.yml
    with:
      version: ${{ inputs.version }}
      build_matrix: ${{ needs.generate-build-matrix.outputs.x86-matrix }}
      region: us-west-2  # unused when publish is false
      source_sha: ${{ inputs.source_sha }}
      publish: false

  qualify-linux-arm-archives:
    name: Qualify ARM archives
    needs: generate-build-matrix
    # contents:read only - and critically NOT id-token:write: the archive
    # jobs execute make from the unreleased candidate commit, and any
    # id-token grant would let that build code mint an OIDC token.
    permissions:
      contents: read
    uses: ./.github/workflows/call-build-linux-arm-packages.yml
    with:
      version: ${{ inputs.version }}
      build_matrix: ${{ needs.generate-build-matrix.outputs.arm-matrix }}
      region: us-west-2  # unused when publish is false
      source_sha: ${{ inputs.source_sha }}
      publish: false

  # Release candidates skip distro packages in production (build-release.yml
  # gates them on !rc), so qualification mirrors that applicability.
  qualify-packages:
    name: Qualify RPM/DEB packages
    needs: validate-inputs
    if: ${{ !contains(inputs.version, '-rc') }}
    # GitHub validates the CALLED workflow's job-level permission requests
    # against this grant even for jobs its conditions skip, so the grant
    # must cover packages.yml's publish jobs (id-token + contents write)
    # although publish=false skips them. This does NOT expose credentials
    # to candidate code: every packages.yml job that executes the build
    # (build-rpm/deb, test-rpm/deb, process-inputs, build-summary) is
    # job-level pinned to contents:read, so only the skipped publish jobs
    # could ever receive the broader grant.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ inputs.version }}
      source_sha: ${{ inputs.source_sha }}
      publish: false

  qualification-summary:
    name: Qualification summary
    needs:
      - qualify-linux-x86-archives
      - qualify-linux-arm-archives
      - qualify-packages
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check qualification results
        env:
          X86: ${{ needs.qualify-linux-x86-archives.result }}
          ARM: ${{ needs.qualify-linux-arm-archives.result }}
          PACKAGES: ${{ needs.qualify-packages.result }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "x86 archives: $X86"
          echo "arm archives: $ARM"
          echo "packages:     $PACKAGES"
          if [[ "$X86" != "success" || "$ARM" != "success" ]]; then
            exit 1
          fi
          # Packages may skip only for release candidates; a GA with a
          # skipped package matrix is a hole in the gate, not a pass.
          if [[ "$PACKAGES" == "skipped" ]]; then
            if [[ "$VERSION" != *-rc* ]]; then
              echo "GA qualification cannot pass with the package matrix skipped."
              exit 1
            fi
            echo "Package matrix skipped: expected for release candidate $VERSION."
          elif [[ "$PACKAGES" != "success" ]]; then
            exit 1
          fi
          echo "Qualification passed: every required build succeeded with no production write."
